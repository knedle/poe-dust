<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POE Dust prices — Admin login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f4efe6;
      color: #1a0e04;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      background: linear-gradient(160deg, #fffdf5 0%, #f8f0e0 100%);
      border: 1px solid #d4bc8c;
      border-radius: 8px;
      padding: 2rem 2.25rem;
      width: 320px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      box-shadow: 0 4px 20px #7a301020;
    }

    h1 {
      font-size: 1.3rem;
      color: #7a3010;
      text-shadow: 0 1px 0 #fffdf5;
    }
    h1 span { color: #1a0e04; }

    label {
      font-size: 0.85rem;
      color: #6a5030;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    input[type="password"] {
      background: #fffdf5;
      border: 1px solid #c8a870;
      color: #1a0e04;
      padding: 0.5rem 0.75rem;
      border-radius: 4px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="password"]:focus { border-color: #7a3010; }

    button {
      background: linear-gradient(180deg, #c87830 0%, #7a3010 100%);
      border: 1px solid #7a3010;
      color: #fffdf5;
      padding: 0.55rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
      font-family: inherit;
      transition: filter 0.2s;
    }
    button:hover { filter: brightness(1.15); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .error-msg {
      color: #8a2020;
      background: #fdf0f0;
      border: 1px solid #d4a0a0;
      border-radius: 4px;
      padding: 0.5rem 0.75rem;
      font-size: 0.83rem;
      display: none;
    }
    .error-msg.visible { display: block; }

    .back-link {
      font-size: 0.8rem;
      color: #7a3010;
      text-decoration: none;
      text-align: center;
    }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

<form class="login-card" id="loginForm">
  <h1>POE <span>Dust</span> — Admin</h1>
  <label>Password
    <input type="password" id="password" autocomplete="current-password" autofocus>
  </label>
  <div class="error-msg" id="error"></div>
  <button type="submit" id="submitBtn">Sign in</button>
  <a class="back-link" href="/">&larr; Back to prices</a>
</form>

<script>
const form = document.getElementById('loginForm');
const passwordInput = document.getElementById('password');
const errorEl = document.getElementById('error');
const submitBtn = document.getElementById('submitBtn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorEl.classList.remove('visible');
  submitBtn.disabled = true;
  try {
    const res = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: passwordInput.value }),
    });
    if (!res.ok) {
      errorEl.textContent = 'Wrong password.';
      errorEl.classList.add('visible');
      submitBtn.disabled = false;
      return;
    }
    window.location.href = '/';
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.classList.add('visible');
    submitBtn.disabled = false;
  }
});
</script>

</body>
</html>
