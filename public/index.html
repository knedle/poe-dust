<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POE Dust prices</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f4efe6;
      color: #1a0e04;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(180deg, #ede5d0 0%, #f4efe6 100%);
      border-bottom: 2px solid #c8a870;
      padding: 1.25rem 2rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .header-top {
      display: flex;
      align-items: center;
      gap: 2rem;
      flex-wrap: wrap;
    }

    header h1 {
      font-size: 1.6rem;
      color: #7a3010;
      text-shadow: 0 1px 0 #fffdf5;
      white-space: nowrap;
    }
    header h1 span { color: #1a0e04; }

    .controls {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .controls label { font-size: 0.85rem; color: #6a5030; }

    input[type="text"], input[type="number"] {
      background: #fffdf5;
      border: 1px solid #c8a870;
      color: #1a0e04;
      padding: 0.4rem 0.75rem;
      border-radius: 4px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"] { width: 180px; }
    input[type="number"] { width: 90px; }
    input:focus { border-color: #7a3010; }

    button { font-family: inherit; cursor: pointer; border-radius: 4px; font-size: 0.9rem; }

    button#loadBtn {
      background: linear-gradient(180deg, #c87830 0%, #7a3010 100%);
      border: 1px solid #7a3010;
      color: #fffdf5;
      padding: 0.45rem 1.25rem;
      transition: filter 0.2s;
      white-space: nowrap;
    }
    button#loadBtn:hover { filter: brightness(1.15); }
    button#loadBtn:disabled { opacity: 0.45; cursor: not-allowed; filter: none; }

    button#filterBtn, button#logoutBtn {
      background: linear-gradient(180deg, #e8dcc0 0%, #c8a870 100%);
      border: 1px solid #a07840;
      color: #1a0e04;
      padding: 0.45rem 1rem;
      transition: filter 0.2s;
    }
    button#filterBtn:hover, button#logoutBtn:hover { filter: brightness(1.1); }

    .admin-area { margin-left: auto; display: flex; align-items: center; gap: 0.5rem; }

    .type-btn {
      background: #ede5d0;
      border: 1px solid #c8a870;
      color: #6a5030;
      padding: 0.3rem 0.9rem;
      border-radius: 20px;
      font-size: 0.82rem;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .type-btn:hover { border-color: #7a3010; color: #1a0e04; background: #e0d4b8; }
    .type-btn.active { background: #7a3010; border-color: #7a3010; color: #fffdf5; }

    #status {
      padding: 0.75rem 2rem;
      font-size: 0.85rem;
      color: #6a5030;
      min-height: 2.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid #c8a870;
      border-top-color: #7a3010;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    .spinner.active { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #count-badge {
      background: #ede5d0;
      border: 1px solid #c8a870;
      border-radius: 20px;
      padding: 0.15rem 0.6rem;
      font-size: 0.8rem;
      color: #7a3010;
      font-weight: 600;
    }

    .error-msg {
      color: #8a2020;
      background: #fdf0f0;
      border: 1px solid #d4a0a0;
      border-radius: 4px;
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
    }

    main { padding: 0.5rem 2rem 3rem; overflow-x: auto; }

    table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }

    thead th {
      background: #ede5d0;
      border-bottom: 2px solid #c8a870;
      color: #7a3010;
      font-weight: 600;
      padding: 0.5rem 0.7rem;
      text-align: right;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }
    thead th:nth-child(1) { text-align: left; }
    thead th.sorted { color: #1a0e04; background: #e0d4b8; }
    thead th .arrow { font-size: 0.7rem; margin-left: 0.2rem; }
    thead th.no-sort { cursor: default; }

    tbody td {
      border-bottom: 1px solid #e0d4b8;
      padding: 0.4rem 0.7rem;
      text-align: right;
      white-space: nowrap;
    }
    tbody td:nth-child(1) { text-align: left; }
    tbody tr:hover { background: #f8f0e0; }

    .empty-row td { text-align: center; color: #8a6840; padding: 3rem; }

    .edit-btn {
      background: #ede5d0;
      border: 1px solid #c8a870;
      color: #6a5030;
      padding: 0.25rem 0.7rem;
      border-radius: 4px;
      font-size: 0.78rem;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .edit-btn:hover { border-color: #7a3010; color: #1a0e04; background: #e0d4b8; }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #1a0e0480;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-overlay.visible { display: flex; }

    .modal {
      background: linear-gradient(160deg, #fffdf5 0%, #f8f0e0 100%);
      border: 1px solid #d4bc8c;
      border-radius: 8px;
      padding: 1.5rem;
      width: 420px;
      max-width: 90vw;
      box-shadow: 0 8px 30px #00000040;
    }
    .modal h2 { color: #7a3010; font-size: 1.15rem; margin-bottom: 1rem; }
    .modal-row { display: flex; gap: 0.75rem; margin-bottom: 0.75rem; }
    .modal-row label {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      font-size: 0.8rem;
      color: #6a5030;
    }
    .modal-row input, .modal-row select {
      background: #fffdf5;
      border: 1px solid #c8a870;
      color: #1a0e04;
      padding: 0.4rem 0.6rem;
      border-radius: 4px;
      font-size: 0.9rem;
      width: 100%;
      outline: none;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 0.5rem; }
    button#editSaveBtn {
      background: linear-gradient(180deg, #c87830 0%, #7a3010 100%);
      border: 1px solid #7a3010;
      color: #fffdf5;
      padding: 0.45rem 1.1rem;
    }
    button#editCancelBtn {
      background: #ede5d0;
      border: 1px solid #c8a870;
      color: #1a0e04;
      padding: 0.45rem 1.1rem;
    }
  </style>
</head>
<body>

<header>
  <div class="header-top">
    <h1>POE <span>Dust</span> prices</h1>
    <div class="admin-area">
      <button id="logoutBtn" style="display:none">Logout</button>
    </div>
  </div>
  <div class="controls">
    <label>League:</label>
    <input type="text" id="leagueInput" value="" placeholder="detecting…" />
    <button id="loadBtn">Load</button>
    <label>Min (chaos):</label>
    <input type="number" id="minChaos" value="0" min="0" step="1" />
    <label>Max (chaos):</label>
    <input type="number" id="maxChaos" value="" min="0" step="1" placeholder="∞" />
    <button id="filterBtn">Filter</button>
  </div>
  <div class="controls">
    <input type="text" id="nameFilter" placeholder="Search items…" />
    <div id="slots-filter" style="display:flex; gap:0.5rem;"></div>
  </div>
</header>

<div id="status">
  <div class="spinner" id="spinner"></div>
  <span id="statusText">Detecting current league…</span>
  <span id="count-badge" style="display:none"></span>
</div>

<main>
  <table>
    <thead><tr id="headerRow"></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
</main>

<div class="modal-overlay" id="editOverlay">
  <div class="modal">
    <h2 id="editModalTitle">Edit</h2>
    <form id="editForm">
      <div class="modal-row">
        <label>Type
          <select id="editType">
            <option value="">—</option>
            <option value="Weapon">Weapon</option>
            <option value="Armour">Armour</option>
            <option value="Jewellery">Jewellery</option>
          </select>
        </label>
        <label>Subtype
          <input type="text" id="editSubtype" placeholder="e.g. Amethyst Ring">
        </label>
        <label>Slots
          <input type="number" id="editSlots" min="1" step="1">
        </label>
      </div>
      <div class="modal-row">
        <label>ilvl 83<input type="number" id="editDust83"></label>
        <label>ilvl 83 +20q<input type="number" id="editDust83q20"></label>
      </div>
      <div class="modal-row">
        <label>ilvl 84<input type="number" id="editDust84"></label>
        <label>ilvl 84 +20q<input type="number" id="editDust84q20"></label>
      </div>
      <div class="modal-row">
        <label>ilvl 85<input type="number" id="editDust85"></label>
        <label>ilvl 85 +20q<input type="number" id="editDust85q20"></label>
      </div>
      <div class="error-msg" id="editError" style="display:none"></div>
      <div class="modal-actions">
        <button type="button" id="editCancelBtn">Cancel</button>
        <button type="submit" id="editSaveBtn">Save</button>
      </div>
    </form>
  </div>
</div>

<script>
const COLUMNS = [
  { key: 'name', label: 'Name', numeric: false },
  { key: 'slots', label: 'Slots', numeric: true },
  { key: 'chaosValue', label: 'Price (c)', numeric: true },
  { key: 'dust83', label: '83', numeric: true },
  { key: 'dust83q20', label: '83+20', numeric: true },
  { key: 'eff83', label: 'dust/c 83', numeric: true },
  { key: 'dust84', label: '84', numeric: true },
  { key: 'dust84q20', label: '84+20', numeric: true },
  { key: 'eff84', label: 'dust/c 84', numeric: true },
  { key: 'dust85', label: '85', numeric: true },
  { key: 'dust85q20', label: '85+20', numeric: true },
  { key: 'eff85', label: 'dust/c 85', numeric: true },
];
const DUST_FIELDS = ['dust83', 'dust83q20', 'dust84', 'dust84q20', 'dust85', 'dust85q20'];
const TYPE_LABELS = { UniqueWeapon: 'Weapon', UniqueArmour: 'Armour', UniqueAccessory: 'Jewellery' };
const CACHE_TTL = 60 * 60 * 1000;
const SKIP_LEAGUES = new Set(['Standard', 'Hardcore', 'SSF Standard', 'SSF Hardcore']);

let rawItems = [];
let priceByName = new Map();
let mergedItems = [];
let isAdmin = false;
let sortKey = 'chaosValue';
let sortDir = 'desc';
let activeSlots = 'all';
let nameQuery = '';
let minChaos = 0;
let maxChaos = Infinity;
let refreshBlockedUntil = 0;
let btnInterval = null;
let editingItemName = null;

function computeEfficiency(dustQ20, chaosValue) {
  if (dustQ20 == null || !chaosValue) return null;
  return dustQ20 / chaosValue;
}

function mergeItemsWithPrices() {
  const merged = [];
  for (const item of rawItems) {
    const price = priceByName.get(item.name);
    if (!price) continue;
    merged.push({
      ...item,
      chaosValue: price.chaosValue,
      _category: price._category,
      eff83: computeEfficiency(item.dust83q20, price.chaosValue),
      eff84: computeEfficiency(item.dust84q20, price.chaosValue),
      eff85: computeEfficiency(item.dust85q20, price.chaosValue),
    });
  }
  mergedItems = merged;
}

function renderHeader() {
  const row = document.getElementById('headerRow');
  row.innerHTML = '';
  for (const col of COLUMNS) {
    const th = document.createElement('th');
    const arrow = sortKey === col.key ? `<span class="arrow">${sortDir === 'asc' ? '\u25b2' : '\u25bc'}</span>` : '';
    th.innerHTML = col.label + arrow;
    if (sortKey === col.key) th.classList.add('sorted');
    th.addEventListener('click', () => {
      if (sortKey === col.key) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
      else { sortKey = col.key; sortDir = col.numeric ? 'desc' : 'asc'; }
      renderHeader();
      applyAndRender();
    });
    row.appendChild(th);
  }
  if (isAdmin) {
    const th = document.createElement('th');
    th.textContent = 'Edit';
    th.classList.add('no-sort');
    row.appendChild(th);
  }
}

function formatNumber(n) {
  if (n == null) return '\u2014';
  return Math.round(n).toLocaleString('en-US');
}

function formatEfficiency(n) {
  if (n == null) return '\u2014';
  return n.toFixed(2);
}

function defaultTypeFor(item) {
  return item.type || TYPE_LABELS[item._category] || '';
}

function openEditModal(item) {
  editingItemName = item.name;
  document.getElementById('editModalTitle').textContent = `Edit — ${item.name}`;
  document.getElementById('editType').value = defaultTypeFor(item);
  document.getElementById('editSubtype').value = item.subtype ?? '';
  document.getElementById('editSlots').value = item.slots ?? '';
  for (const field of DUST_FIELDS) {
    document.getElementById('edit' + field[0].toUpperCase() + field.slice(1)).value = item[field] ?? '';
  }
  document.getElementById('editError').style.display = 'none';
  document.getElementById('editOverlay').classList.add('visible');
}

function closeEditModal() {
  editingItemName = null;
  document.getElementById('editOverlay').classList.remove('visible');
}

function showEditError(msg) {
  const el = document.getElementById('editError');
  el.textContent = msg;
  el.style.display = 'block';
}

function collectEditFields() {
  const fields = {};
  const typeVal = document.getElementById('editType').value;
  fields.type = typeVal === '' ? null : typeVal;
  const subtypeVal = document.getElementById('editSubtype').value.trim();
  fields.subtype = subtypeVal === '' ? null : subtypeVal;
  const slotsVal = document.getElementById('editSlots').value;
  fields.slots = slotsVal === '' ? null : Math.round(parseFloat(slotsVal));
  for (const field of DUST_FIELDS) {
    const val = document.getElementById('edit' + field[0].toUpperCase() + field.slice(1)).value;
    fields[field] = val === '' ? null : Math.round(parseFloat(val));
  }
  return fields;
}

async function saveEditModal() {
  const name = editingItemName;
  const fields = collectEditFields();
  const res = await fetch(`/api/admin/items/${encodeURIComponent(name)}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(fields),
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const item = rawItems.find(i => i.name === name);
  if (item) Object.assign(item, fields);
  mergeItemsWithPrices();
  renderSlotsFilter();
  applyAndRender();
  closeEditModal();
}

function renderRows(items) {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  const colCount = COLUMNS.length + (isAdmin ? 1 : 0);
  if (items.length === 0) {
    tbody.innerHTML = `<tr class="empty-row"><td colspan="${colCount}">No items match the current filters.</td></tr>`;
    return;
  }
  for (const item of items) {
    const tr = document.createElement('tr');
    for (const col of COLUMNS) {
      const td = document.createElement('td');
      if (col.key === 'name') td.textContent = item.name;
      else if (col.key === 'chaosValue') td.textContent = formatNumber(item.chaosValue);
      else if (col.key.startsWith('eff')) td.textContent = formatEfficiency(item[col.key]);
      else td.textContent = formatNumber(item[col.key]);
      tr.appendChild(td);
    }
    if (isAdmin) {
      const td = document.createElement('td');
      const btn = document.createElement('button');
      btn.className = 'edit-btn';
      btn.textContent = 'Edit';
      btn.addEventListener('click', () => openEditModal(item));
      td.appendChild(btn);
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
}

function sortItems(items) {
  const sorted = [...items];
  sorted.sort((a, b) => {
    const av = a[sortKey];
    const bv = b[sortKey];
    if (av == null && bv == null) return 0;
    if (av == null) return 1;
    if (bv == null) return -1;
    if (typeof av === 'string') return sortDir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
    return sortDir === 'asc' ? av - bv : bv - av;
  });
  return sorted;
}

function renderSlotsFilter() {
  const bar = document.getElementById('slots-filter');
  bar.innerHTML = '';
  const presentSlots = [...new Set(mergedItems.map(i => i.slots).filter(s => s != null))].sort((a, b) => a - b);
  for (const slots of ['all', ...presentSlots]) {
    const btn = document.createElement('button');
    btn.className = 'type-btn' + (slots === activeSlots ? ' active' : '');
    btn.textContent = slots === 'all' ? 'All' : `${slots} slot${slots === 1 ? '' : 's'}`;
    btn.addEventListener('click', () => { activeSlots = slots; renderSlotsFilter(); applyAndRender(); });
    bar.appendChild(btn);
  }
}

function applyAndRender() {
  let filtered = mergedItems;
  if (activeSlots !== 'all') filtered = filtered.filter(i => i.slots === activeSlots);
  if (minChaos > 0) filtered = filtered.filter(i => i.chaosValue >= minChaos);
  if (maxChaos < Infinity) filtered = filtered.filter(i => i.chaosValue <= maxChaos);
  if (nameQuery) filtered = filtered.filter(i => i.name.toLowerCase().includes(nameQuery));
  const sorted = sortItems(filtered);
  renderRows(sorted);
  const badge = document.getElementById('count-badge');
  badge.textContent = `${sorted.length} items`;
  badge.style.display = 'inline';
}

function updateLoadBtn() {
  const btn = document.getElementById('loadBtn');
  const remaining = refreshBlockedUntil - Date.now();
  if (remaining > 0) {
    btn.disabled = true;
    btn.textContent = `Load (${Math.ceil(remaining / 60000)}m)`;
  } else {
    btn.disabled = false;
    btn.textContent = 'Load';
  }
}

async function loadPrices() {
  const league = document.getElementById('leagueInput').value.trim();
  if (!league) { alert('Enter a league name.'); return; }
  const btn = document.getElementById('loadBtn');
  const spinner = document.getElementById('spinner');
  const statusText = document.getElementById('statusText');
  btn.disabled = true;
  spinner.classList.add('active');
  statusText.textContent = 'Loading prices from poe.ninja\u2026';
  try {
    const res = await fetch(`/api/prices?league=${encodeURIComponent(league)}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    priceByName = new Map(data.items.map(i => [i.name, i]));
    mergeItemsWithPrices();
    renderSlotsFilter();
    applyAndRender();
    refreshBlockedUntil = data.timestamp + CACHE_TTL;
    if (btnInterval) clearInterval(btnInterval);
    btnInterval = setInterval(updateLoadBtn, 30000);
    updateLoadBtn();
    const ageMins = Math.round((Date.now() - data.timestamp) / 60000);
    const ageStr = data.fromCache ? ` (cached ${ageMins}m ago)` : '';
    statusText.textContent = data.errors && data.errors.length
      ? `Errors: ${data.errors.join(', ')}`
      : `Loaded \u2014 league "${league}"${ageStr}.`;
  } catch (e) {
    statusText.innerHTML = `<span class="error-msg">Error: ${e.message}</span>`;
    updateLoadBtn();
  } finally {
    spinner.classList.remove('active');
  }
}

async function loadItems() {
  const res = await fetch('/api/items');
  rawItems = await res.json();
  mergeItemsWithPrices();
}

async function detectCurrentLeague() {
  const input = document.getElementById('leagueInput');
  const statusText = document.getElementById('statusText');
  try {
    const res = await fetch('/api/leagues');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const leagues = data.result ?? data;
    const challenge = leagues.find(l =>
      !SKIP_LEAGUES.has(l.id) && !l.id.startsWith('SSF ') && !l.id.startsWith('Hardcore ')
    );
    input.value = challenge ? challenge.id : 'Standard';
  } catch (e) {
    input.value = 'Standard';
    statusText.textContent = 'League detection error: ' + e.message;
    return;
  }
  const league = input.value;
  try {
    const res = await fetch(`/api/cache-status?league=${encodeURIComponent(league)}`);
    const status = await res.json();
    if (!status.timestamp) {
      statusText.textContent = `League: ${league} \u2014 no data yet, click Load.`;
    } else if (!status.fresh) {
      const ageMins = Math.round((Date.now() - status.timestamp) / 60000);
      statusText.innerHTML = `League: ${league} \u2014 <strong>data is ${ageMins}m old</strong>, click Load to refresh.`;
    } else {
      refreshBlockedUntil = status.timestamp + CACHE_TTL;
      loadPrices();
    }
  } catch (e) {
    statusText.textContent = `League: ${league} \u2014 click Load to fetch data.`;
  }
}

async function checkAdminSession() {
  const res = await fetch('/api/admin/session');
  const data = await res.json();
  isAdmin = !!data.authenticated;
  updateAdminUI();
}

function updateAdminUI() {
  document.getElementById('logoutBtn').style.display = isAdmin ? 'inline-block' : 'none';
  renderHeader();
  applyAndRender();
}

document.getElementById('loadBtn').addEventListener('click', loadPrices);
document.getElementById('leagueInput').addEventListener('keydown', e => { if (e.key === 'Enter') loadPrices(); });
document.getElementById('filterBtn').addEventListener('click', () => {
  minChaos = parseFloat(document.getElementById('minChaos').value) || 0;
  const maxVal = document.getElementById('maxChaos').value;
  maxChaos = maxVal === '' ? Infinity : parseFloat(maxVal);
  applyAndRender();
});
document.getElementById('nameFilter').addEventListener('input', e => {
  nameQuery = e.target.value.trim().toLowerCase();
  applyAndRender();
});
document.getElementById('logoutBtn').addEventListener('click', async () => {
  await fetch('/api/admin/logout', { method: 'POST' });
  isAdmin = false;
  updateAdminUI();
});
document.getElementById('editForm').addEventListener('submit', async e => {
  e.preventDefault();
  try {
    await saveEditModal();
  } catch (err) {
    showEditError(`Save failed: ${err.message}`);
  }
});
document.getElementById('editCancelBtn').addEventListener('click', closeEditModal);
document.getElementById('editOverlay').addEventListener('click', e => {
  if (e.target.id === 'editOverlay') closeEditModal();
});

renderHeader();
checkAdminSession();
loadItems().then(() => { renderSlotsFilter(); applyAndRender(); });
detectCurrentLeague();
</script>

</body>
</html>
